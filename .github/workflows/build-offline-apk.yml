name: Build BolMizan 100% Free Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 for Capacitor 8 / Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate 2048-bit RSA Signing Keystore in Cloud
        run: |
          keytool -genkeypair -v -keystore android/app/bolmizan-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias bolmizan-key \
            -storepass "BolMizanSovereign2026!" \
            -keypass "BolMizanSovereign2026!" \
            -dname "CN=BolMizan Sovereign OS, OU=Sindh AgriTech, O=BolMizan Protocol, L=Sakrand, ST=Sindh, C=PK"

      - name: Bundle Google Fonts Locally for 100% Offline Support
        run: |
          mkdir -p public/fonts
          curl -sL "https://gstatic.com" -o public/fonts/fraunces-600.ttf
          curl -sL "https://gstatic.com" -o public/fonts/jetbrains-400.ttf
          curl -sL "https://gstatic.com" -o public/fonts/arabic-400.ttf
          curl -sL "https://gstatic.com" -o public/fonts/urdu-400.ttf
          curl -sL "https://gstatic.com" -o public/fonts/jakarta-400.ttf
          cat << 'EOF' > public/fonts/offline-fonts.css
          @font-face { font-family: 'Fraunces'; font-weight: 600; src: url('/fonts/fraunces-600.ttf') format('truetype'); }
          @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('/fonts/jetbrains-400.ttf') format('truetype'); }
          @font-face { font-family: 'Noto Naskh Arabic'; font-weight: 400; src: url('/fonts/arabic-400.ttf') format('truetype'); }
          @font-face { font-family: 'Noto Nastaliq Urdu'; font-weight: 400; src: url('/fonts/urdu-400.ttf') format('truetype'); }
          @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; src: url('/fonts/jakarta-400.ttf') format('truetype'); }
          EOF

      - name: Install Dependencies
        run: npm install

      - name: Build Offline Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Compile Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename Signed APK for Distribution
        run: cp android/app/build/outputs/apk/release/app-release.apk BolMizan-v1.0-Signed-Release.apk

      - name: Publish Free Direct-Download Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-signed-release
          name: BolMizan v1.0 Signed Offline Android APK (100% Free)
          body: |
            Official cryptographically signed offline Android application for BolMizan Protocol.
            - 100% Offline Sovereign Khata, Mandi Voice Parser & Anti-Scam Shield
            - Zero internet required after installation
            - Built for Sakrand & Sindh merchants and ISEF evaluation
          files: BolMizan-v1.0-Signed-Release.apk
