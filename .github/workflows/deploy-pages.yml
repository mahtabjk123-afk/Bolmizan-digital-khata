name: Deploy Full App to Surge CDN
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vite build --base=./
      - run: npx surge ./dist bolmizan-sakrand.surge.sh --token ${{ secrets.SURGE_TOKEN }}